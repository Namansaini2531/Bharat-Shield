[package]
name = "bharat_shield"
version = "1.0.0"
description = "Bharat-Shield Sentinel Desktop Application"
authors = ["Bharat-Shield Team"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "bharat_shield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

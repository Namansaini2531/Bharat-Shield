version: '3.8'

services:
  # 1. PostgreSQL 16 with pgvector Extension & HNSW Vector Indexing
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bharat_shield_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bharat_shield}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Pub/Sub Queue & Cache
  redis:
    image: redis:7-alpine
    container_name: bharat_shield_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. BHARAT-SHIELD FastAPI Backend Intelligence Engine
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bharat_shield_backend
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bharat_shield}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data

  # 4. React + Vite Analyst Sentinel Command Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bharat_shield_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
